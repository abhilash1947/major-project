spring.application.name=railway-dss
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/railway_dss
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0

# Logging Configuration
logging.level.root=INFO
logging.level.com.railway.dss=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# gRPC Configuration
grpc.server.port=9090
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=2s

# API Configuration
api.version=1.0.0
api.base-path=/api/v1
